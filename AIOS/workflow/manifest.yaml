    file: .agents/workflows/aios-close.md

  - name: /aios-onboard
    file: .agents/workflows/aios-onboard.md

  - name: /aios-login
    file: .agents/workflows/aios-login.md
    added_in: TM-40

  - name: /aios-newproject
    file: .agents/workflows/aios-newproject.md
