# AIOS Workflow Component Manifest
#
# Central registry of all workflow components and their dependencies.
# Created per TM-39 recommendation, maintained per TM-40.
#
# Last updated: 2026-03-25

# ─── GIT REMOTE ───────────────────────────────────────────────
git:
  remote:
    ssh: git@192.168.0.92:feature-phone/fp-aios-kz.git
    http: http://192.168.0.92/feature-phone/fp-aios-kz.git
  branch_pattern: "eng/{engineer}/{project}"
  main_branch: main
  merge_owners: [KaiwenZheng, James]
  fallback: "GitLab 不可用时可本地继续工作，恢复后再 push"

# ─── MODULE STATES (TM-02) ────────────────────────────────────
states:
  valid:
    - INTAKE
    - RESEARCHING
    - SPEC_READY
    - READY_TO_IMPLEMENT
    - IMPLEMENTING
    - READY_FOR_MANUAL_BUILD
    - READY_FOR_MANUAL_FLASH
    - READY_FOR_MANUAL_LOG_CAPTURE
    - READY_TO_INTEGRATE
    - BLOCKED
    - CLOSED
  terminal: [CLOSED]
  human_gates:
    - READY_FOR_MANUAL_BUILD
    - READY_FOR_MANUAL_FLASH
    - READY_FOR_MANUAL_LOG_CAPTURE
  state_file: "projects/<project>/state/module_states.yaml"
  graph_file: "projects/<project>/state/module_graph.yaml"

# ─── AGENTS ───────────────────────────────────────────────────
agents:
  - name: memo-critic
    file: workflow/agents/memo-critic.md
    skills: [intake-memo, clarify-memo]
    trigger: "/aios-workflow Step 2, /aios-intake Step 3"

  - name: api-governor
    file: workflow/agents/api-governor.md
    skills: [detect-api, record-api]
    trigger: "/aios-workflow Step 6 (during implementation)"

  - name: boundary-reviewer
    file: workflow/agents/boundary-reviewer.md
    skills: []
    trigger: "/aios-workflow Step 6 (during implementation)"

  - name: embedded-reviewer
    file: workflow/agents/embedded-reviewer.md
    skills: []
    trigger: "/aios-workflow Step 6 (during implementation)"

  - name: closeout-reviewer
    file: workflow/agents/closeout-reviewer.md
    skills: [close-task, package-commit]
    trigger: "/aios-workflow Step 9, /aios-close Step 1"

  - name: onboarding-agent
    file: workflow/agents/onboarding-agent.md
    skills: [onboard-engineer, register-engineer]
    trigger: "/aios-onboard, first-time /aios-* usage"

  - name: assignment-reviewer
    file: workflow/agents/assignment-reviewer.md
    skills: []
    trigger: "/aios-workflow (after spec freeze)"
    added_in: TM-40

  - name: knowledge-curator
    file: workflow/agents/knowledge-curator.md
    skills: [sync-shared-knowledge]
    trigger: "/aios-close, manual knowledge review"
    added_in: TM-40

  # Future agents (TM-02 — activate in Week 3)
