# AIOS API Registry
#
# TM-35: Extended with module/level/stability/source/constraints/exposure fields
# Schema: AIOS/registry/schema/api_schema.yaml
#
# APIs are organized by module. Each entry must have at minimum:
#   api, module, level, stability, source, layer_from, layer_to, input, output, description
#
# Optional: abi, constraints, dependency, exposure, owner, thread_context, error_codes,
#           unisoc_api, verified, verified_date, pitfall

apis:

  # ===========================================================================
  #  MODULE: memory (5 APIs) — DAP_OSAssociated_unisoc.c
  #  Unisoc底层: SCI_ALLOC_APP, SCI_FREE, memcpy, memset
  # ===========================================================================

  - api: DAP_MemAlloc
    module: memory
    level: L1
    stability: beta
    source: unisoc_os
    layer_from: DAP
    layer_to: OS
    owner: DAP Security Team
    thread_context: any
    input: "uint32 size"
    output: "void *"
    error_codes: [PNULL]
    unisoc_api: SCI_ALLOC_APP
    description: "内存分配封装。失败返回 PNULL"
    constraints:
      mmi_thread_only: false
    exposure:
      app_accessible: true
      sdk_exposed: true
    pitfall: "返回指针做偏移后，原始基地址必须保留用于 free（ADR-004）"

  - api: DAP_MemFree
    module: memory
    level: L1
    stability: beta
    source: unisoc_os
    layer_from: DAP
    layer_to: OS
    owner: DAP Security Team
    thread_context: any
    input: "void *ptr"
    output: void
    error_codes: []
    unisoc_api: SCI_FREE
    description: "内存释放封装。ptr 必须是 DAP_MemAlloc 原始返回值"
    constraints:
      mmi_thread_only: false
    exposure:
      app_accessible: true
      sdk_exposed: true
    pitfall: "释放偏移指针会导致 SCI_Release_Buffer assert / heap 损坏"

  - api: DAP_MemAllocZ
    module: memory
    level: L1
    stability: beta
    source: dap_custom
    layer_from: DAP
    layer_to: OS
    owner: DAP Security Team
    thread_context: any
    input: "uint32 size"
    output: "void *"
    error_codes: [PNULL]
    unisoc_api: "SCI_ALLOC_APP + memset"
    description: "分配内存并清零"
    exposure:
      app_accessible: true
      sdk_exposed: false

  - api: DAP_MemCpy
    module: memory
    level: L1
    stability: beta
    source: dap_custom
    layer_from: DAP
    layer_to: OS
    owner: DAP Security Team
    thread_context: any
    input: "void *dst, const void *src, uint32 size"
    output: "void *"
    error_codes: []
    unisoc_api: memcpy
    description: "内存拷贝（NULL 安全）"
    exposure:
      app_accessible: true
      sdk_exposed: false

  - api: DAP_MemSet
    module: memory
    level: L1
    stability: beta
    source: dap_custom
    layer_from: DAP
    layer_to: OS
    owner: DAP Security Team
    thread_context: any
    input: "void *dst, uint8 val, uint32 size"
    output: "void *"
    error_codes: []
    unisoc_api: memset
    description: "内存填充（NULL 安全）"
    exposure:
      app_accessible: true
      sdk_exposed: false

