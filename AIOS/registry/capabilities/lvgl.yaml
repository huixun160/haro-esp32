# LVGL 9.5.0 Capability Registry
# TM-36 New Module

module: lvgl
description: "LVGL UI 框架 — DAP APP 开发推荐 UI 方案（替代/并行 MMI）"
source: [source_code, dap_lvgl_bridge.c, lv_conf.h]
dap_coverage: "100% (38/38 核心 API 已桥接)"

capabilities:
  - name: screen_display
    description: "屏幕/显示管理"
    layer: APP_CANDIDATE
    apis: [lv_screen_active, lv_obj_clean]
    dap_bridged: true

  - name: object_base
    description: "对象创建/删除/尺寸/位置/对齐"
    layer: APP_CANDIDATE
    apis: [lv_obj_create, lv_obj_delete, lv_obj_set_size, lv_obj_set_pos, lv_obj_set_width, lv_obj_set_height, lv_obj_align, lv_obj_add_flag]
    dap_bridged: true

  - name: style_system
    description: "样式系统（颜色/透明度/边框/圆角/渐变/字体）"
    layer: APP_CANDIDATE
    apis: [lv_obj_set_style_bg_color, lv_obj_set_style_bg_opa, lv_obj_set_style_text_color, lv_obj_set_style_text_font, lv_obj_set_style_border_width, lv_obj_set_style_border_color, lv_obj_set_style_pad_all, lv_obj_set_style_radius, lv_obj_set_style_bg_grad_color]
    dap_bridged: true
    notes: "ABI 安全包装 — uint32_t hex color 而非 lv_color_t struct"

  - name: widgets
    description: "UI 控件（Label/Button/List）"
    layer: APP_CANDIDATE
    apis: [lv_label_create, lv_label_set_text, lv_label_set_long_mode, lv_button_create, lv_list_create, lv_list_add_text, lv_list_add_button]
    dap_bridged: true
    notes: "已启用但未桥接: Arc, Bar, Canvas, Image, Line, Roller, Slider, Table"

  - name: event_system
    description: "事件回调系统"
    layer: APP_CANDIDATE
    apis: [lv_obj_add_event_cb, lv_event_get_code, lv_event_get_target, lv_event_get_user_data]
    dap_bridged: true

  - name: focus_timer_font
    description: "焦点管理 + 定时器 + 字体访问"
    layer: APP_CANDIDATE
    apis: [lv_group_get_default, lv_group_add_obj, lv_timer_create, lv_timer_delete, dap_font_get_builtin]
    dap_bridged: true

  - name: dap_window_mgmt
    description: "DAP 窗口管理（LVGL↔MMI 切换）"
    layer: APP_CANDIDATE
    apis: [DAP_LVGL_OpenWindow, DAP_LVGL_CloseWindow, DAP_LVGL_SetKeyCallback]
    dap_bridged: true

platform_integration:
  display: "240x320 RGB565, 40-line partial buffer, GUI Block bridge"
  input: "Keypad (ring buffer queue), D-pad navigation"
  rtos: "ThreadX (SCI_GetTickCount tick, optional LV_OS_CUSTOM)"
  memory: "48KB LVGL pool + ~19.2KB display buffer"
  fonts: "Montserrat 14 + Source Han Sans SC 16 (CJK)"

enabled_widgets: [Arc, Bar, Button, Canvas, Image, Label, Line, List, Roller, Slider, Table]
enabled_layouts: [Flex]
enabled_themes: [Default, Simple]

dependency: [os_core, device]
notes: |
  LVGL 是目前 DAP 桥接最完善的 UI 模块（38 API 100% 覆盖）。
  APP 开发推荐优先使用 LVGL 而非 Mocor MMI（8% DAP 覆盖）。
  已有完整演示：PalmOS 启动器 + 俄罗斯方块游戏。
